name: Highmark Escalations Sync

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  sync-escalations:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client anthropic requests
    
    - name: Run Highmark escalation sync
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        ASANA_API_TOKEN: ${{ secrets.ASANA_API_TOKEN }}
        ASANA_PROJECT_ID: ${{ secrets.ASANA_PROJECT_ID }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        python highmark_escalations.py
    
    - name: Log execution
      if: always()
      run: echo "Sync completed at $(date)"
